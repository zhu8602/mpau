<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mpau 发布台 · 登录</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e6e6e6;font-family:"Microsoft YaHei",system-ui,sans-serif}
  .card{background:#171a21;border:1px solid #2a2f3a;border-radius:12px;padding:32px;width:340px}
  h1{font-size:18px;margin:0 0 8px}
  p{color:#9aa3b2;font-size:13px;line-height:1.7;margin:0 0 16px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2a2f3a;background:#0f1115;color:#e6e6e6;font-size:14px;outline:none}
  input:focus{border-color:#3b82f6}
  button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer}
  button:hover{background:#2563eb}
  .error{color:#f87171;font-size:13px;margin-top:10px}
  code{background:#0f1115;border:1px solid #2a2f3a;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>mpau 发布台</h1>
    <p>请输入访问令牌。令牌在启动服务的终端输出里(<code>?token=</code> 后面的部分), 也可查看 <code>data/web_token.txt</code>。</p>
    <input name="token" type="password" placeholder="访问令牌" autocomplete="off" autofocus>
    <button type="submit">进入</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
